version: '3.8'

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: lecturehub-postgres
    environment:
      POSTGRES_DB: embedding
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d embedding"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
